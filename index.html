        const viewDashboard = document.getElementById('view-dashboard');
        const viewSubmenu = document.getElementById('view-submenu');
        const btnBackContainer = document.getElementById('btn-back-container');
        const submenuTitle = document.getElementById('submenu-title');
        const submenuKategori = document.getElementById('submenu-kategori');
        const submenuIcon = document.getElementById('submenu-icon');
        const submenuList = document.getElementById('submenu-list');

        function openSubmenu(menuKey) {
            const data = menuData[menuKey];
            
            // Set Konten Header Submenu
            submenuTitle.innerText = data.title;
            submenuKategori.innerText = data.kategori;
            submenuIcon.innerHTML = data.icon;
            submenuIcon.className = `w-14 h-14 rounded-2xl flex items-center justify-center shadow-inner ${data.iconBg}`;
            
            // Render Daftar Link Submenu
            submenuList.innerHTML = '';
            data.items.forEach(item => {
                submenuList.innerHTML += `
                    <a href="${item.url}" target="_blank" class="bg-[#142845] p-4 rounded-[16px] shadow-sm border border-[#1e3a63] flex items-center justify-between hover:bg-[#1e3a8a]/40 hover:border-blue-500/50 transition-all group">
                        <div class="flex items-center gap-4 w-5/6">
                            <div class="w-9 h-9 rounded-full bg-[#1e3a8a]/50 group-hover:bg-blue-600 text-blue-400 group-hover:text-white flex items-center justify-center transition-colors shrink-0 border border-blue-500/30">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
                            </div>
                            <span class="text-[13px] font-bold text-slate-200 leading-snug group-hover:text-white transition-colors">${item.name}</span>
                        </div>
                    </a>
                `;
            });

            // Tampilkan Submenu, Sembunyikan Dashboard Utama
            viewDashboard.classList.add('hidden');
            viewSubmenu.classList.remove('hidden');
            btnBackContainer.classList.remove('hidden');
            btnBackContainer.classList.add('flex');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeSubmenu() {
            viewSubmenu.classList.add('hidden');
            btnBackContainer.classList.add('hidden');
            btnBackContainer.classList.remove('flex');
            viewDashboard.classList.remove('hidden');
        }
    </script>
